<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            background-color:rgb(222, 40, 179);
            gap:20px;
        }

        h1{
            color:white;
            font-size:40px;
        }

        .board{

            display:grid;

            grid-template-columns:repeat(3,100px);
            grid-template-rows:repeat(3,100px);

            gap:5px;
        }

        .cell{

            background-color:rgb(243, 75, 223);
            border:2px solid white;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:40px;
            font-weight:bold;
            color:white;

            cursor:pointer;

            outline:none;
        }

        #msgBox{
            color:white;
            font-size:30px;
        }

        #reset{

            height:40px;
            width:100px;

            border:none;
            border-radius:5px;

            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div class="board">

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

    </div>

    <h2 id="msgBox"></h2>

    <button id="reset">Reset</button>

    <script src="tictak.js"></script>

</body>
</html>
